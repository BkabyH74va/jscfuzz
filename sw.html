<!doctype html>
<script>
self.addEventListener('message', function(e) {
    // Send confirmation back
    e.source.postMessage('received', '*');
    
    if (e.data.cmd === 'hammer') {
        var buf = e.data.buf;
        for (var i = 0; i < 1000; i++) {
            try { buf.resize(i % 2 ? 65536 : 256); } catch(x) {}
        }
    }
});
</script>
