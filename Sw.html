<!doctype html>
<script>
self.addEventListener('message', function(e) {
    if (e.data.cmd === 'hammer') {
        var buf = e.data.buf;
        function hammer(i) {
            if (i >= 100000) return;
            try { buf.resize(i % 2 ? 65536 : 256); } catch(x) {}
            setTimeout(function() { hammer(i + 1); }, 0);
        }
        hammer(0);
    }
});
</script>
