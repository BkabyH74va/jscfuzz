<!doctype html>
<meta name=viewport content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>jscfuzz v41 - JIT CORE ATTACK</title>
<style>
body{background:#000;color:#aaa;font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;margin:0;padding:8px}
#out{white-space:pre-wrap;word-break:break-all;max-height:50vh;overflow:auto}
button{background:#222;color:#ddd;border:1px solid #444;padding:8px 14px;margin:4px;cursor:pointer}
#ver{color:#f66;font-weight:700}
#src{background:#240a08;color:#f99;padding:8px;margin:8px 0;white-space:pre-wrap;word-break:break-all;max-height:30vh;overflow:auto;font-size:12px}
#status{color:#888}
#status.run{color:#0f0}
#ifr{position:absolute;left:-10px;width:1px;height:1px;opacity:.01}
.crash{color:#f66;font-weight:bold}
.success{color:#0f0}
</style>
<div id=ver>jscfuzz v41 - JIT CORE ATTACK</div>
<div id=out></div>
<div>
<button onclick=fuzz()>FUZZ JIT</button>
<button onclick=stop()>STOP</button>
<button onclick=showCrash()>SHOW LAST CRASH</button>
</div>
<div id=src>--</div>
<div id=status>Ready</div>
<iframe id=ifr sandbox="allow-scripts allow-same-origin"></iframe>
<script>
var seed=0,running=false,runOpen=false,iframeTimer=0,lastCrash='';

// JIT OPTIMIZATION BUGS - DFG/FTL compiler errors
// These bypass MTE because they happen in generated machine code
var JIT_PATTERNS=[
// Pattern 0: Type confusion via polymorphic add (DFG bug)
function(){return `
function f(a,b){return a+b;}
for(var i=0;i<100000;i++)f(i,i+1); // Train with ints
var o={valueOf:function(){return 1;}};
var r=f(o,1); // Trigger deopt or type confusion
return "poly:"+r;
`},

// Pattern 1: Array length confusion after allocation
function(){return `
function f(arr){
  var x=arr.length;
  var y=new Array(x);
  for(var i=0;i<x;i++)y[i]=arr[i]*2;
  return y;
}
var a=new Array(100);
for(var i=0;i<100;i++)a[i]=i;
for(var i=0;i<50000;i++)f(a);
a.length=0; // Shrink after JIT compiled
var r=f(a);
return "array:"+r.length;
`},

// Pattern 2: Bounds check elimination bug
function(){return `
function f(arr,i){return arr[i];}
var a=[1,2,3,4,5];
for(var i=0;i<100000;i++)f(a,i%5);
// Try OOB after JIT removed bounds check
var r=[];
for(var i=0;i<10;i++)r.push(f(a,i));
return "bounds:"+r.join(",");
`},

// Pattern 3: Float/Int type confusion in DFG
function(){return `
function f(x){return x|0;}
for(var i=0;i<100000;i++)f(i+0.5);
var r=f({valueOf:function(){return 1.5;}});
return "float:"+r;
`},

// Pattern 4: String length optimization bug
function(){return `
function f(s){return s.length;}
for(var i=0;i<100000;i++)f("test");
var long="";
for(var i=0;i<10000;i++)long+="A";
var r=f(long);
return "strlen:"+r;
`},

// Pattern 5: TypedArray species confusion
function(){return `
function f(ta){return ta.subarray(0,5);}
var a=new Uint8Array(100);
for(var i=0;i<100000;i++)f(a);
var r=f(a);
return "species:"+r.constructor.name;
`},

// Pattern 6: Deoptimization during side effect
function(){return `
function f(o){return o.x+o.y;}
var o={x:1,y:2};
for(var i=0;i<100000;i++)f(o);
Object.defineProperty(o,'x',{get:function(){o.y=0x7fffffff;return 1;}});
var r=f(o);
return "deopt:"+r;
`},

// Pattern 7: Inline cache confusion
function(){return `
function f(o){return o.a;}
var o1={a:1};
var o2={b:2,a:3};
for(var i=0;i<100000;i++)f(o1);
var r=f(o2);
return "ic:"+r;
`},

// Pattern 8: OSR (On-Stack Replacement) bug
function(){return `
function f(){
  var sum=0;
  for(var i=0;i<1000000;i++){
    sum+=i;
    if(i==500000){
      // Trigger OSR here
      var a=new Array(1000);
      a.fill(1.1);
      sum+=a[0];
    }
  }
  return sum;
}
var r=f();
return "osr:"+r;
`},

// Pattern 9: Constant folding with side effects
function(){return `
function f(){
  var x=1;
  function g(){x=2;return 1;}
  var y=x+g()+x; // If g() inlined, x might be constant-folded to 1
  return y;
}
for(var i=0;i<100000;i++)f();
var r=f();
return "const:"+r;
`}
];

function mk(s){return function(){s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function ri(R,n){return Math.floor(R()*n)%n}

function gen(sd){
var R=mk(sd);
var s='"use strict";var r=[];';
for(var i=0;i<3;i++){
var p=JIT_PATTERNS[ri(R,JIT_PATTERNS.length)]();
s+='try{r.push((function(){'+p+'})());}catch(e){r.push("ERR:"+e.name);}';
}
s+='return r.join("|");';
return s;
}

function PRE(p){
return '<!doctype html><meta charset=utf-8><script>var C=async function(){try{return await(async function(){'+p+'})();}catch(e){return "CRASH:"+e.name+":"+e.message;}};C().then(function(c){C().then(function(h){parent.postMessage({k:"r",cold:c,hot:h},"*")})});<\/script>';
}

function kill(){try{ifr.contentWindow.location='about:blank'}catch(e){}clearTimeout(iframeTimer);}

function run(p,ms){
return new Promise(function(res){
kill();
var done=false;
function fin(o){if(done)return;done=true;clearTimeout(iframeTimer);window.removeEventListener('message',onmsg);res(o)}
function onmsg(e){if(e.data&&e.data.k==='r')fin(e.data)}
window.addEventListener('message',onmsg);
iframeTimer=setTimeout(function(){fin({cold:'HANG',hot:'HANG'})},ms);
ifr.srcdoc=PRE(p);
});
}

async function go(){
if(runOpen)return;
runOpen=true;
var p=gen(seed);
document.getElementById('src').textContent='-- seed '+seed+'\n'+p;
document.getElementById('status').className='run';
document.getElementById('status').textContent='Running seed '+seed+'...';
var o=await run(p,8000); // Longer timeout for JIT compilation
runOpen=false;
var stx;
if(o.cold==='HANG'){stx='<span class="crash">HANG/CRASH - JIT INFINITE LOOP</span>';lastCrash=p;}
else if(o.cold!==o.hot){stx='<span class="crash">DIVERGE! JIT BUG! cold='+o.cold+' hot='+o.hot+'</span>';lastCrash=p;}
else if(o.cold.indexOf('CRASH:')===0){stx='<span class="crash">'+o.cold+'</span>';lastCrash=p;}
else{stx='<span class="success">'+o.cold+'</span>';}
var line='<div>-- seed '+seed+'</div><div>'+stx+'</div>';
document.getElementById('out').innerHTML+=line;
document.getElementById('out').scrollTop=99999;
if(!running){document.getElementById('status').textContent='Stopped at seed '+seed;return;}
seed++;
document.getElementById('status').textContent='Running seed '+seed+'...';
if(running)setTimeout(go,200);
}

function fuzz(){running=true;go();}
function stop(){running=false;document.getElementById('status').textContent='Stopped at seed '+seed;}
function showCrash(){if(lastCrash)document.getElementById('src').textContent=lastCrash;}

document.getElementById('status').textContent='Ready. Press FUZZ.';
</script>
