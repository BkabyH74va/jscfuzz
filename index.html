<!doctype html>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>Manual Test</title>
<style>
body{background:#000;color:#0f0;font:20px monospace;padding:20px}
textarea{width:100%;height:200px;background:#111;color:#0f0;font:16px monospace}
button{font-size:20px;padding:10px 20px;background:#222;color:#fff;border:1px solid #444}
#output{background:#001100;border:1px solid #0f0;padding:10px;margin-top:20px;min-height:200px;white-space:pre-wrap}
</style>
<h2>Manual Test</h2>
<textarea id=code>
// Ultra simple test
var x = 1 + 1;
console.log("Test: " + x);
</textarea>
<br><br>
<button onclick="runCode()">RUN</button>
<div id=output>Output will appear here...</div>
<script>
function runCode() {
    var code = document.getElementById('code').value;
    var output = document.getElementById('output');
    output.textContent = '';
    
    // Capture console.log
    var oldLog = console.log;
    console.log = function(msg) {
        output.textContent += msg + '\n';
    };
    
    try {
        eval(code);
        output.textContent += '\n[Done]';
    } catch(e) {
        output.textContent += '\n[Error: ' + e.name + ' - ' + e.message + ']';
    }
    
    console.log = oldLog;
}
</script>
