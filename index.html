<!doctype html>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>jscfuzz v7</title>
<style>
*{box-sizing:border-box}
body{background:#0b0b0b;color:#ccc;font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;margin:0;padding:8px}
#out{white-space:pre-wrap;word-break:break-word;background:#000;border:1px solid #2a2a2a;padding:8px;min-height:110px;margin-bottom:8px}
#src{white-space:pre-wrap;word-break:break-word;background:#04140a;color:#7fe07f;border:1px solid #073;padding:8px;margin:8px 0}
button{font:inherit;background:#1e1e1e;color:#ddd;border:1px solid #444;border-radius:6px;padding:9px 14px}
button:active{background:#3a3a3a}
textarea{width:100%;height:110px;background:#000;color:#ffd84d;border:1px solid #444;border-radius:6px;font:inherit;padding:8px}
.warn{color:#ffd84d}.bad{color:#ff8080}.ok{color:#7fe07f}.dim{color:#777}
</style>
<div id=out></div>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px">
<button id=fz>FUZZ</button><button id=st>STOP</button><button id=run>RUN</button><button id=cp>COPY</button><button id=cl>CLR</button>
</div>
<div id=src>--</div>
<textarea id=ta spellcheck=false autocapitalize=off autocorrect=off></textarea>
<script>
(function(){
var P=new URLSearchParams(location.search);
var VER='jscfuzz v7';
var SMALL=P.has('small'),BIG=P.has('big');
var SHOW=P.has('show')||P.has('noexec');
var SEED0=(P.get('seed')!==null&&P.get('seed')!=='')?parseInt(P.get('seed'),10):null;
var HANGMS=parseInt(P.get('ms')||'1500',10);
var HOTN=parseInt(P.get('n')||'80',10);
var HB='jscfuzz-hb',LSRC='jscfuzz-lastsrc',LTA='jscfuzz-ta',LRUN='jscfuzz-run';

var out=document.getElementById('out'),srcEl=document.getElementById('src'),ta=document.getElementById('ta');
function log(s,c){var d=document.createElement('div');if(c)d.className=c;d.textContent=s;out.appendChild(d);while(out.childNodes.length>400)out.removeChild(out.firstChild);window.scrollTo(0,1e7);}
function showSrc(s){srcEl.textContent=s;try{localStorage.setItem(LSRC,s);}catch(e){}}

function mulberry32(a){return function(){a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
var TYS=['Uint8Array','Uint8ClampedArray','Uint16Array','Int32Array','Float64Array'];
var BIGS=SMALL?['2**14','2**16','100000']:(BIG?['2**28','2**31-1','2**26','2**30']:['2**16','2**20','1000','2**24']);
var STRS=SMALL?['""','"a"','"abc"']:['""','"a"','"abc"','"q".repeat(2**16)','"w".repeat(2**20)'];

function gen(seed){
  var R=mulberry32(seed>>>0);
  function ri(n){return Math.floor(R()*n)%n;}
  function pk(a){return a[ri(a.length)];}
  var o=['var W=function(f){try{return f()}catch(e){return 0}};'],vals=[],i,n=6+ri(7),e;
  for(i=0;i<n;i++){
    switch(ri(10)){
      case 0: e='('+pk(STRS)+')';break;
      case 1: e='new '+pk(TYS)+'('+pk(BIGS)+')';break;
      case 2: e='new '+pk(TYS)+'('+(1+ri(64))+')';break;
      case 3: e='new ArrayBuffer('+pk(BIGS)+')';break;
      case 4: e='new ArrayBuffer('+(1+ri(64))+')';break;
      case 5: e='['+ri(9)+','+ri(9)+','+ri(9)+']';break;
      case 6: e='{a:'+ri(9)+'}';break;
      case 7: e='new Map([['+ri(9)+',"s"]])';break;
      case 8: e='new DataView(new ArrayBuffer(8))';break;
      default: e='new Set(['+ri(9)+'])';
    }
    o.push('let v'+i+'=W(function(){return '+e+'});');vals.push('v'+i);
  }
  var m=4+ri(7),A,B,T,e2;
  for(i=0;i<m;i++){
    A=pk(vals);B=pk(vals);T='v'+(n+i);
    switch(ri(18)){
      case 0: e2='structuredClone('+A+')';break;
      case 1: e2='JSON.parse(JSON.stringify('+A+'))';break;
      case 2: e2='('+A+'.set('+B+',0),'+A+')';break;
      case 3: e2=A+'.slice(0,1)';break;
      case 4: e2=A+'.subarray(0,1)';break;
      case 5: e2=A+'.buffer';break;
      case 6: e2='[...'+A+']';break;
      case 7: e2='new Uint8Array('+A+')';break;
      case 8: e2=A+'.fill(0)';break;
      case 9: e2=A+'.repeat(1)';break;
      case 10: e2=A+'.length';break;
      case 11: e2='('+A+'||0)+1';break;
      case 12: e2='structuredClone(['+A+'])';break;
      case 13: e2='structuredClone({k:'+A+'})';break;
      case 14: e2='structuredClone(new Map([["k",'+A+']]))';break;
      case 15: e2='structuredClone(new Set(['+A+']))';break;
      case 16: e2='new DataView('+A+')';break;
      default: e2='structuredClone('+A+'.buffer)';
    }
    o.push('let '+T+'=W(function(){return '+e2+'});');vals.push(T);
  }
  var k=3+ri(3);
  for(i=0;i<k;i++)o.push('W(function(){return structuredClone('+pk(vals)+')});');
  o.push('return '+pk(vals)+';');
  return o.join('\n');
}

var WSRC="onmessage=function(e){var d=e.data,f;try{f=new Function(d.src);}catch(err){postMessage({t:'syntax',m:String(err.message)});return;}var c;try{f();c='ok';}catch(err){c='threw:'+((err&&err.name)||'?');}var h='-';if(d.n>0){try{for(var i=0;i<d.n;i++)f();h='ok';}catch(err){h='threw:'+((err&&err.name)||'?');}}postMessage({t:'done',c:c,h:h});};";

var W=null,wd=0,mode='idle',nxt=0,curSeed=null,stopFlag=false;
function mk(){var w=new Worker(URL.createObjectURL(new Blob([WSRC],{type:'text/javascript'})));w.onmessage=onmsg;return w;}
function reset(){clearTimeout(wd);if(W)W.terminate();W=mk();}
function hb(v){try{localStorage.setItem(HB,v);}catch(e){}}
function finish(){if(mode==='fuzz'){setTimeout(step,0);}else{mode='idle';log('done.','dim');}}
function onmsg(e){
  var d=e.data;clearTimeout(wd);
  if(mode==='run'){try{localStorage.setItem(LRUN,'ok');}catch(x){}}
  else if(curSeed!==null)hb('seed:'+curSeed+':done');
  if(d.t==='syntax'){log('  SYNTAX: '+d.m,'bad');finish();return;}
  log('  cold='+d.c+'  hot='+d.h,(d.c==='ok'&&d.h==='ok')?'dim':'warn');
  if(d.c!==d.h)log('  DIVERGENCE '+d.c+' vs '+d.h,'bad');
  finish();
}
function runSeed(seed){
  var s=gen(seed);showSrc(s);curSeed=seed;
  hb('seed:'+seed+':running');
  reset();log('-- seed '+seed);
  W.postMessage({t:'run',src:'"use strict";\n'+s,n:HOTN});
  wd=setTimeout(function(){log('  HANG killed at '+HANGMS+'ms','warn');reset();finish();},HANGMS);
}
function step(){if(stopFlag){mode='idle';log('stopped.');return;}runSeed(nxt++);}

document.getElementById('fz').onclick=function(){if(mode==='fuzz')return;mode='fuzz';stopFlag=false;log('FUZZ from seed '+nxt);step();};
document.getElementById('st').onclick=function(){stopFlag=true;};
document.getElementById('cl').onclick=function(){out.textContent='';};
document.getElementById('cp').onclick=function(){var t=srcEl.textContent;
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(function(){log('copied.','ok');},function(){log('copy blocked','warn');});
  else log('no clipboard','warn');};
document.getElementById('run').onclick=function(){
  var code=ta.value;if(!code.trim())return;
  try{localStorage.setItem(LTA,code);localStorage.setItem(LRUN,'pending');}catch(e){}
  mode='run';curSeed=null;reset();log('-- RUN n='+HOTN);
  W.postMessage({t:'run',src:'"use strict";\n'+code,n:HOTN});
  wd=setTimeout(function(){log('  RUN hang killed','warn');reset();mode='idle';},HANGMS*5);
};
ta.value=localStorage.getItem(LTA)||'structuredClone(new Uint8Array(new Set([3])))';
ta.oninput=function(){try{localStorage.setItem(LTA,ta.value);}catch(e){}};

log(VER+'   ms='+HANGMS+'  n='+HOTN+(SMALL?'  [small]':'')+(BIG?'  [big]':'')+(SHOW?'  [show]':''));
try{ if(localStorage.getItem(LRUN)==='pending'){log('PREVIOUS RUN CRASHED THE TAB','bad');localStorage.setItem(LRUN,'ok');} }catch(e){}
var last=localStorage.getItem(LSRC);if(last)srcEl.textContent=last;
if(SHOW){
  if(SEED0!==null){var s=gen(SEED0);showSrc(s);log('seed '+SEED0+' source, NOT executed:');log(s);}
  else log('SHOW: last generated source is in the green box.');
}else if(SEED0!==null){mode='replay';log('replay seed '+SEED0);runSeed(SEED0);}
else{
  var from=0,hb0=localStorage.getItem(HB);
  if(hb0){var mm=/^seed:(\d+):(\w+)/.exec(hb0);if(mm){from=parseInt(mm[1],10)+1;if(mm[2]==='running')log('PREVIOUS RUN DIED ON SEED '+(from-1),'bad');}}
  nxt=from;log('tap FUZZ, or paste a snippet and tap RUN');
}
W=mk();
})();
</script>
