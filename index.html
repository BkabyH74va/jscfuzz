  a[0]=0;a[1]=97;a[2]=115;a[3]=109;a[4]=1;a[5]=0;a[6]=0;a[7]=0;

  var a=t==="png"?mkpng(R):t==="gif"?mkgif(R):t==="jpg"?mkjpg(R):t==="webp"?mkwebp(R):

function PRE(p,sd){

function killIframe(){

  killIframe();
  var done=false;
  function fin(o){if(done)return;done=true;clearTimeout(iframeTimer);window.removeEventListener('message',onmsg);res(o)}
