function(){return 'var ab=new ArrayBuffer(256);var ta=new Uint8Array(ab);var fake=256;Object.defineProperty(ab,"byteLength",{get:function(){fake=fake*2;return fake;}});try{var c=structuredClone(ta,{transfer:[ab]});return "grow:"+c.byteLength;}catch(e){return "grow-err:"+e.name;}'},

function(){return 'var ab=new ArrayBuffer(256);var ta=new Uint8Array(ab);Object.defineProperty(ab,"byteLength",{get:function(){return -1;}});try{var c=structuredClone(ta,{transfer:[ab]});return "neg:"+c.byteLength;}catch(e){return "neg-err:"+e.name;}'},

function(){return 'var ab=new ArrayBuffer(256);var ta=new Uint8Array(ab);Object.defineProperty(ab,"byteLength",{get:function(){return 0xFFFFFFFF;}});try{var c=structuredClone(ta,{transfer:[ab]});return "max:"+c.byteLength;}catch(e){return "max-err:"+e.name;}'},

function(){return 'var ab=new ArrayBuffer(256);var ta=new Uint8Array(ab);Object.defineProperty(ab,"byteLength",{get:function(){try{ab.transfer();}catch(e){}return 256;}});try{var c=structuredClone(ta,{transfer:[ab]});return "detach:"+c.byteLength;}catch(e){return "detach-err:"+e.name;}'},

function(){return 'var ab=new ArrayBuffer(256);var ta=new Uint8Array(ab);var count=0;Object.defineProperty(ab,"byteLength",{get:function(){count++;if(count==1)return 256;if(count==2)return 512;return 1024;}});try{var c=structuredClone(ta,{transfer:[ab]});return "multi:"+c.byteLength+":count:"+count;}catch(e){return "multi-err:"+e.name;}'},

function(){return 'var ab=new ArrayBuffer(256);var ta=new Uint8Array(ab);Object.defineProperty(ab,"byteLength",{get:function(){return {valueOf:function(){try{ab.transfer();}catch(e){}return 256;}};}});try{var c=structuredClone(ta,{transfer:[ab]});return "obj:"+c.byteLength;}catch(e){return "obj-err:"+e.name;}'},

function mk(s){return function(){s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function ri(R,n){return Math.floor(R()*n)%n}

function gen(sd){
var R=mk(sd);
var s='"use strict";var r=[];';
for(var i=0;i<3;i++){
var p=PATTERNS[ri(R,PATTERNS.length)]();
s+='try{r.push((function(){'+p+'})());}catch(e){r.push("ERR:"+e.name);}';
}
s+='return r.join("|");';
return s;
}

function PRE(p){
return '<!doctype html><meta charset=utf-8><script>var C=async function(){try{return await(async function(){'+p+'})();}catch(e){return "CRASH:"+e.name+":"+e.message;}};C().then(function(c){C().then(function(h){parent.postMessage({k:"r",cold:c,hot:h},"*")})});<\/script>';
}

function kill(){try{ifr.contentWindow.location='about:blank'}catch(e){}clearTimeout(iframeTimer);}

function run(p,ms){
return new Promise(function(res){
kill();
var done=false;
function fin(o){if(done)return;done=true;clearTimeout(iframeTimer);window.removeEventListener('message',onmsg);res(o)}
function onmsg(e){if(e.data&&e.data.k==='r')fin(e.data)}

iframeTimer=setTimeout(function(){fin({cold:'HANG',hot:'HANG'})},ms);
ifr.srcdoc=PRE(p);

}

async function go(){
if(runOpen)return;
runOpen=true;
var p=gen(seed);
document.getElementById('src').textContent='-- seed '+seed+'\n'+p;
document.getElementById('status').className='run';
document.getElementById('status').textContent='Running seed '+seed+'...';
var o=await run(p,5000);
runOpen=false;
var stx;
if(o.cold==='HANG'){stx='<span class="crash">HANG/CRASH - INFINITE LOOP</span>';lastCrash=p;}

function fuzz(){running=true;go();}
