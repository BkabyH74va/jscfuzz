<!doctype html>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>Manual Test</title>
<style>body{background:#000;color:#0f0;font:20px monospace;padding:20px}textarea{width:100%;height:200px;background:#111;color:#0f0}button{font-size:20px;padding:10px}</style>
<textarea id=code>
var v=[1,2,3,4,5];
var e={valueOf:function(){v.length=0;v.length=100;return 2;}};
var result=v[e];
document.body.innerHTML="Result: "+result;
</textarea>
<br><button onclick="eval(document.getElementById('code').value)">RUN</button>
