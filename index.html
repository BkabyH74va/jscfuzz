function mk(s){return function(){s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function ri(R,n){var x=Math.floor(R()*n)%n;return x<0?0:x}
function hex(a){var s='';for(var i=0;i<a.length;i++)s+=(a[i]<16?'0':'')+a[i].toString(16);return s}

function score(n){
  if(!n)return 0;
  if(n.indexOf('EXC_BAD_ACCESS')>0)return 100; // REAL CRASH
  if(n.indexOf('SIGSEGV')>0)return 100;
  if(n.indexOf('SIGBUS')>0)return 90;
  if(n.indexOf('HANG')>0)return 50; // Potential infinite loop = bug
  if(n.indexOf('RangeError')>0)return 5;
  if(n.indexOf('EncodingError')>0)return 4;
  return 1;
}
function addCorp(t,h,s){
  if(s<10)return;
  var i,c=0,wi=-1,ws=99;
  for(i=0;i<CORP.length;i++){if(CORP[i].h===h)return;if(CORP[i].t===t)c++}
  if(c>=3){
    for(i=0;i<CORP.length;i++)if(CORP[i].t===t&&CORP[i].s<ws){ws=CORP[i].s;wi=i}
    if(wi>=0&&ws<=s)CORP.splice(wi,1);else return;
  }
  CORP.push({t:t,h:h,s:s});
  CORP.sort(function(a,b){return b.s-a.s});
  if(CORP.length>50)CORP.length=50;
  saveCorp();
}
function pickCorp(R,t){
  var pool=[];
  for(var i=0;i<CORP.length;i++)if(CORP[i].t===t)pool.push(CORP[i]);
  if(!pool.length)return null;
  pool.sort(function(a,b){return b.s-a.s});
  return pool[ri(R,pool.length)];
}

// Weighted random selection
function pickType(R){
  var total=0,i;
  for(i=0;i<K_WEIGHTS.length;i++)total+=K_WEIGHTS[i];
  var r=R()*total;
  for(i=0;i<K_WEIGHTS.length;i++){r-=K_WEIGHTS[i];if(r<=0)return i;}
  return 0;
}

function fields(t,a){
  var i,f;
  if(t==="jpg"){
    for(i=2;i<a.length-9;i++)if(a[i]===255&&(a[i+1]===192||a[i+1]===193||a[i+1]===194))return [[i+2,2],[i+5,2],[i+7,2],[i+9,1]];

function by(t,R){

function rs38(sd){

  var t=K[pickType(R)];

function killIframe(){

  clearTimeout(iframeTimer);

function runInIframe(p,sd,ms,expr){
 return new Promise(function(res){
  killIframe();
  var done=false;
  function fin(o){if(done)return;done=true;clearTimeout(iframeTimer);window.removeEventListener('message',onmsg);res(o)}
  function onmsg(e){if(!e.data||e.data.k!=='r')return;fin(e.data)}
  window.addEventListener('message',onmsg);
  iframeTimer=setTimeout(function(){fin({k:'r',cold:'HANG',hot:'HANG'})},ms);
  ifr.srcdoc=PRE(p,sd,expr);

function learn(trace,hs){
  if(!trace)return;
  var parts=trace.split(';');
  for(var i=0;i<parts.length;i++){
    var m=parts[i].match(/^(\d+):(\w+):(.*)$/);
    if(!m)continue;
    var h=hs[+m[1]];
    if(h)addCorp(m[2],h,score(parts[i]));
  }
}

async function go(useManual){

 runOpen=false;
 
 var stx;

   stx='<span class="crash">HANG/CRASH killed at '+MS+'ms</span>';
   lastCrash=p;
   try{localStorage.setItem('LCRASH',JSON.stringify({seed:activeSeed,prog:p}))}catch(e){}
   // Also try to get actual crash info
   try{
     var crashInfo={
       seed:activeSeed,
       time:new Date().toISOString(),
       ua:navigator.userAgent,
       prog:p.substring(0,1000)
     };
     localStorage.setItem('CRASH_'+Date.now(),JSON.stringify(crashInfo));
   }catch(e){}
 }
 else if(o.cold===o.hot){
   stx='<span class="success">same: '+o.cold.substring(0,100)+'</span>';
   if(hs.length)learn(o.cold,hs);
 }
 else{
   stx='<span class="crash">DIVERGE cold='+o.cold.substring(0,50)+' hot='+o.hot.substring(0,50)+'</span>';
   lastCrash=p;
   try{localStorage.setItem('jscfuzz-div',p)}catch(e){}
 }
 
 var line='<span style="color:#aaa">-- seed '+activeSeed+'</span>\n  '+stx;
 out.innerHTML+=line+'\n';out.scrollTop=out.scrollHeight;
 while(out.childNodes.length>200)out.removeChild(out.firstChild);
 
 if(!running){st.className='';st.textContent='Stopped at seed '+activeSeed+'. corpus='+CORP.length;return;}
 seed++;activeSeed=seed;
 try{localStorage.setItem('LASEED',String(activeSeed))}catch(e){}
 st.className='run';st.textContent='Running seed '+activeSeed+'... corpus='+CORP.length;
 if(running)setTimeout(function(){go(false)},100); // Slower for MTE
}
