<script>

ver.textContent='jscfuzz '+VER+'  |  mode '+MODE;

var seed=START,running=false,runOpen=false,iframeTimer=0,lastCrash='',activeSeed=START;
var CORP=[];
var K=["png","png","png","jpg","jpg","webp","gif","gif","wav","wasm","ttf","woff","mp3"];
var FLD={wav:[[4,4],[22,2],[24,4],[28,4],[32,2],[40,4]],wasm:[[9,1]],
 ttf:[[4,2],[8,2]],woff:[[8,4],[12,2]],mp3:[[6,1],[7,1],[8,1],[9,1],[22,1],[23,1]]};
var V1=[0,1,2,127,255],V2=[0,1,2,32767,65535],V4=[0,1,2,2147483647,4294967295];

function mk(s){return function(){s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function ri(R,n){var x=Math.floor(R()*n)%n;return x<0?0:x}
function sz(){return SMALL?1024:BIG?(1<<24):(1<<14)}
function hex(a){var s='';for(var i=0;i<a.length;i++)s+=(a[i]<16?'0':'')+a[i].toString(16);return s}
function u32(a,o,v){a[o]=v>>>24&255;a[o+1]=v>>>16&255;a[o+2]=v>>>8&255;a[o+3]=v&255}
function u16(a,o,v){a[o]=v>>>8&255;a[o+1]=v&255}
function put(a,o,s){for(var i=0;i<s.length;i++)a[o+i]=s.charCodeAt(i)&255}
function hb(){try{localStorage.setItem('HB',String(Date.now()))}catch(e){}}
function hxPage(h){var a=new Uint8Array(h.length>>1);for(var i=0;i<a.length;i++)a[i]=parseInt(h.substr(i*2,2),16);return a}

function saveCorp(){try{localStorage.setItem('CORP',JSON.stringify(CORP))}catch(e){}}
function loadCorp(){try{var c=localStorage.getItem('CORP');if(c)CORP=JSON.parse(c)||[]}catch(e){CORP=[]}}
function score(n){
  if(!n)return 0;
  if(n.indexOf(':ok')>0)return 6;
  if(n.indexOf('RangeError')>0||n.indexOf('IndexSizeError')>0)return 5;
  if(n.indexOf('EncodingError')>0)return 4;
  if(n.indexOf('NotSupportedError')>0||n.indexOf('SyntaxError')>0||n.indexOf('CompileError')>0)return 3;
  if(n.indexOf('TypeError')>0||n.indexOf('TO')>0)return 2;
  return 1;
}
function addCorp(t,h,s){
  if(s<4)return;
  var i,c=0,wi=-1,ws=99;
  for(i=0;i<CORP.length;i++){if(CORP[i].h===h)return;if(CORP[i].t===t)c++}
  if(c>=CAPT){
    for(i=0;i<CORP.length;i++)if(CORP[i].t===t&&CORP[i].s<ws){ws=CORP[i].s;wi=i}
    if(wi>=0&&ws<=s)CORP.splice(wi,1);else return;
  }
  CORP.push({t:t,h:h,s:s});
  CORP.sort(function(a,b){return b.s-a.s});
  if(CORP.length>MAXC)CORP.length=MAXC;
  saveCorp();
}
function pickCorp(R,t){
  var pool=[];
  for(var i=0;i<CORP.length;i++)if(CORP[i].t===t)pool.push(CORP[i]);
  if(!pool.length)return null;
  pool.sort(function(a,b){return b.s-a.s});
  return pool[ri(R,pool.length)];
}

function(){return 'var b=new ArrayBuffer(SZ);var v=new Uint8Array(b);return structuredClone([v,v])'},
function(){return 'var v=new Float64Array(SZ>>3);return structuredClone(v)'},
function(){return 'var v=new Uint8Array(SZ);return structuredClone(v,{transfer:[v.buffer]})'},
function(){return 'var v=new Uint8Array(SZ);return structuredClone(v,{transfer:[v.buffer,v.buffer]})'},
function(){return 'var v=new Uint8Array(SZ);var t=v.buffer;structuredClone(v,{transfer:[t]});return structuredClone(t)'},
function(){return 'var v=new Uint8Array(SZ);var m=new Map();m.set("k",v);return structuredClone(m)'},
function(){return 'var v=new Uint8Array(SZ);return structuredClone(new Set([v]))'},
function(){return 'var v=new Uint8Array(SZ);return structuredClone([...v])'},
function(){return 'var v=new Uint8Array(SZ);return structuredClone(v.subarray(1))'},
function(){return 'var v=new BigInt64Array(SZ>>3);return structuredClone(v)'},
function(){return 'var v=new Uint8Array(SZ);return structuredClone({a:{b:{c:v}}})'},
function(){return 'var v=new Uint8Array(SZ);return structuredClone(new Proxy({a:v},{}))'},
function(){return 'var v=new Uint8Array(SZ);var r=Proxy.revocable({},{});r.revoke();return structuredClone(r.proxy)'},
function(){return 'var c=document.createElement("canvas");c.width=64;c.height=64;var x=c.getContext("2d");x.fillRect(0,0,8,8);return structuredClone(x.getImageData(0,0,64,64))'},
function(){return 'var v=new Uint8Array(new Set([3,4,5]));return structuredClone(v)'},
function(){return 'var v=new Uint8Array(SZ);var bc=new BroadcastChannel("c");bc.postMessage(v);return v'},

];

function rs(sd){
  var R=mk(sd),s='"use strict";\nvar SZ='+sz()+',E=[],W=function(f,d){try{return f()}catch(e){E.push(e.name);return d}};\n';
  for(var i=0;i<NL;i++){
    var p=(MODE===1?PAT[i%PAT.length]:PAT[ri(R,PAT.length)])();
    s+='W(function(){return (function(){'+p+'})()},0);\n';
  }
  return s+'return E.join(";")+"|ok";';
}

function fields(t,a){
  var i,f;
  if(t==="jpg"){
    for(i=2;i<a.length-9;i++)if(a[i]===255&&(a[i+1]===192||a[i+1]===193||a[i+1]===194))return [[i+2,2],[i+5,2],[i+7,2],[i+9,1]];
    return [];
  }
  if(t==="png"){
    f=[[16,4],[20,4]];
    for(i=0;i<a.length-8;i++)if(a[i]===73&&a[i+1]===68&&a[i+2]===65&&a[i+3]===84)f.push([i-4,4]);
    return f;
  }
  if(t==="gif"){
    f=[[6,2],[8,2],[71,1]];
    for(i=0;i<a.length-9;i++)if(a[i]===44)f.push([i+5,2],[i+7,2],[i+9,1]);
    return f;
  }
  if(t==="webp"){
    f=[[4,4]];
    for(i=0;i<a.length-7;i++)if(a[i]===86&&a[i+1]===80&&a[i+2]===56)f.push([i+4,4]);
    return f;
  }
  return FLD[t]||[];
}

function mut(a,R,t){
  var f=fields(t,a),k=Math.floor(R()*10),e,o,w,vv,p;
  if(k<5&&f.length){
    e=f[ri(R,f.length)];o=e[0];w=e[1];
    if(o>=0&&o+w<=a.length){
      if(w===1)vv=V1[ri(R,V1.length)];
      else if(w===2)vv=V2[ri(R,V2.length)];
      else{var v=V4.slice();v.push(a.length+1,a.length*2,a.length+4096);vv=v[ri(R,v.length)]}
      if(w===1)a[o]=vv;else if(w===2)u16(a,o,vv);else u32(a,o,vv);
    }
  }
  else if(k<7&&a.length>20)return a.subarray(0,16+Math.floor(R()*(a.length-16)));
  else if(k<9&&a.length>24){p=Math.floor(a.length/2)+Math.floor(R()*(a.length/2-1));a[p]=255}
  else if(a.length>24){p=Math.floor(a.length/2)+Math.floor(R()*(a.length/2-1));a[p]=Math.floor(R()*256)}
  return a;
}

function dataB(u){var b=atob(u.split(',')[1]),a=new Uint8Array(b.length),i;for(i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
function cvs(type){
  var w=2+Math.floor(Math.random()*20),h=2+Math.floor(Math.random()*20);
  var c=document.createElement('canvas');c.width=w;c.height=h;
  var x=c.getContext('2d');
  x.fillStyle='#37a';x.fillRect(0,0,w,h);
  x.fillStyle='#e94';x.fillRect(0,0,Math.max(1,w>>1),Math.max(1,h>>1));
  x.fillStyle='#fff';x.fillRect(0,0,1,1);
  return dataB(c.toDataURL(type));
}
function mkgif(){return new Uint8Array([71,73,70,56,57,97,1,0,1,0,128,0,0,0,0,0,255,255,255,44,0,0,0,0,1,0,1,0,0,2,2,68,1,0,59])}
function mkwav(R){
  var n=32+Math.floor(R()*64),a=new Uint8Array(44+n),i;
  put(a,0,"RIFF");u32(a,4,36+n);put(a,8,"WAVE");put(a,12,"fmt ");u32(a,16,16);
  u16(a,20,1);u16(a,22,1);u32(a,24,8000);u32(a,28,8000);u16(a,32,1);u16(a,34,8);
  put(a,36,"data");u32(a,40,n);
  for(i=44;i<44+n;i++)a[i]=128+(Math.floor(R()*64)-32);
  return a}
function mkwasm(){return new Uint8Array([0,97,115,109,1,0,0,0,0,5,4,110,97,109,101])}
function mkfnt(R,w){
  var n=40+Math.floor(R()*40),a=new Uint8Array(n+200),o,i;
  if(w){put(a,0,"wOFF");u32(a,4,65536);u32(a,8,n+44);u16(a,12,1);o=44}
  else{a[0]=0;a[1]=1;a[2]=0;a[3]=0;u16(a,4,1);o=12}
  for(i=o;i<a.length;i++)a[i]=Math.floor(R()*256);
  return a}
function mkmp3(R){
  var nf=4+Math.floor(R()*4),fl=417,a=new Uint8Array(20+nf*fl),i,p;
  put(a,0,"ID3");a[3]=3;a[4]=0;a[5]=0;a[6]=0;a[7]=0;a[8]=0;a[9]=10;
  for(i=10;i<20;i++)a[i]=Math.floor(R()*256);
  p=20;
  for(i=0;i<nf;i++){a[p]=255;a[p+1]=251;a[p+2]=144;a[p+3]=100;p+=fl}
  return a.subarray(0,p)}

function by(t,R){
  if(t==="png")return cvs("image/png");
  if(t==="jpg")return cvs("image/jpeg");
  if(t==="webp")return cvs("image/webp");
  if(t==="gif")return mkgif();
  if(t==="wav")return mkwav(R);
  if(t==="wasm")return mkwasm();
  if(t==="ttf")return mkfnt(R,0);
  if(t==="woff")return mkfnt(R,1);
  return mkmp3(R);
}

function callFor(t,i,h){
  var H='hx("'+h+'")';
  if(t==="ttf"||t==="woff")return 'new FontFace("f'+i+'",'+H+').load().then(function(f){return df(f,'+i+')})';
  if(t==="wav"||t==="mp3")return 'AC.decodeAudioData('+H+'.buffer)';
  if(t==="wasm")return 'WebAssembly.compile('+H+')';
  return 'createImageBitmap(new Blob(['+H+'])).then(dw)';
}

function rs5(sd){
  var R=mk(sd),s='"use strict";\nvar AC=null;try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}\n';
  s+='if(!window.FontFace)TR.push("noFF");\nvar q,i;\n';
  var t=K[ri(R,K.length)],base=by(t,R),hs=[],ex='';
  if(t==="ttf"||t==="woff")ex='new FontFace("f0",new Uint8Array(64)).load()';
  else if(t==="wav"||t==="mp3")ex='new AudioContext().decodeAudioData(new Uint8Array(64).buffer)';
  else if(t==="wasm")ex='WebAssembly.compile(new Uint8Array(64))';
  else ex='createImageBitmap(new Blob([new Uint8Array(64)]))';
  var i=0;
  while(i<PL){
    s+='q=[];\n';
    for(var j=0;j<CW&&i<PL;j++,i++){
      var b;
      if(i===0)b=base;
      else{
        var c=(CORP.length&&R()<0.5)?pickCorp(R,t):null;
        b=c?mut(hxPage(c.h),R,t):mut(new Uint8Array(base),R,t);
      }
      var h=hex(b);hs.push(h);
      s+='q.push(A("'+t+'",'+i+','+callFor(t,i,h)+'));\n';
    }
    s+='await Promise.all(q);\n';
  }
  return {code:s,expr:ex,hs:hs};
}

function PRE(p,sd){
 return '<!doctype html><meta charset=utf-8><script>'+
 'var SEED='+sd+';var R=mk(SEED);var TR=[];'+
 'function mk(s){return function(){s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}'+
 'function hx(s){var a=new Uint8Array(s.length>>1);for(var i=0;i<a.length;i++)a[i]=parseInt(s.substr(i*2,2),16);return a}'+
 'function T(p,ms){return Promise.race([p,new Promise(function(_,j){setTimeout(function(){j("TO")},ms)})])}'+
 'async function A(t,i,p){try{await T(p,600);TR.push(i+":"+t+":ok")}catch(e){TR.push(i+":"+t+":x:"+(e&&e.name||e||"E"))}}'+
 'function dw(bm){try{var c=new OffscreenCanvas(8,8);c.getContext("2d").drawImage(bm,0,0)}catch(e){}return bm}'+

 'var COLD=async function(){TR=[];R=mk(SEED);try{var rv=await (async function(){'+p+'})();if(rv!==undefined)return String(rv)}catch(e){TR.push("999:top:"+(e&&e.name))}TR.sort(function(a,b){return parseInt(a)-parseInt(b)});return TR.join(";")};'+
 '(async function(){var c=await COLD();var h=await COLD();parent.postMessage({k:"r",cold:c,hot:h},"*")})()'+

}

function killIframe(){
  try{ifr.contentWindow.location='about:blank'}catch(e){}
  clearTimeout(iframeTimer);
}

function runInIframe(p,sd,ms){
 return new Promise(function(res){
  killIframe();
  var done=false;
  function fin(o){if(done)return;done=true;clearTimeout(iframeTimer);window.removeEventListener('message',onmsg);res(o)}
  function onmsg(e){if(!e.data||e.data.k!=='r')return;fin(e.data)}
  window.addEventListener('message',onmsg);
  iframeTimer=setTimeout(function(){fin({k:'r',cold:'HANG',hot:'HANG'})},ms);
  ifr.srcdoc=PRE(p,sd);
 });
}

function learn(trace,hs){
  if(!trace)return;
  var parts=trace.split(';');
  for(var i=0;i<parts.length;i++){
    var m=parts[i].match(/^(\d+):(\w+):(.*)$/);
    if(!m)continue;
    var h=hs[+m[1]];
    if(h)addCorp(m[2],h,score(parts[i]));
  }
}

async function go(useManual){
 if(runOpen)return;
 runOpen=true;
 activeSeed=useManual?'MANUAL':seed;
 try{localStorage.setItem('LASEED',String(activeSeed))}catch(e){}
 var p,hs=[];
 if(useManual&&ta.value.trim()){p=ta.value.trim();}
 else if(MODE===5){var o5=rs5(seed);p=o5.code;hs=o5.hs;}
 else{p=rs(seed);}
 src.textContent='-- seed '+activeSeed+'\n'+p;
 try{localStorage.setItem('LSRC',p);localStorage.setItem('LRUN',String(seed))}catch(e){}
 hb();
 st.className='run';st.textContent='Running seed '+activeSeed+'... corpus='+CORP.length;
 var o=await runInIframe(p,seed,MS);
 runOpen=false;
 var stx;
 if(o.cold==='HANG'){stx='HANG/CRASH killed at '+MS+'ms';lastCrash=p;try{localStorage.setItem('LCRASH',JSON.stringify({seed:activeSeed,prog:p}))}catch(e){}}
 else if(o.cold===o.hot){stx='<span style="color:#9f9">same: '+o.cold+' (JIT x10)</span>';if(MODE===5)learn(o.cold,hs);}
 else{stx='<span style="color:#f66">DIVERGE cold='+o.cold+' hot='+o.hot+'</span>';lastCrash=p;try{localStorage.setItem('jscfuzz-div',p)}catch(e){}}
 var line='<span style="color:#aaa">-- seed '+activeSeed+'</span>\n  '+stx;
 if(o.cold==='HANG')line='<span style="color:#aaa">-- seed '+activeSeed+'</span>\n  <span style="color:#f66">HANG/CRASH killed at '+MS+'ms</span>';
 out.innerHTML+=line+'\n';out.scrollTop=out.scrollHeight;
 while(out.childNodes.length>500)out.removeChild(out.firstChild);
 if(!running){st.className='';st.textContent='Stopped at seed '+activeSeed+'. corpus='+CORP.length;return;}
 seed++;activeSeed=seed;
 try{localStorage.setItem('LASEED',String(activeSeed))}catch(e){}
 st.className='run';st.textContent='Running seed '+activeSeed+'... corpus='+CORP.length;
 if(running)setTimeout(function(){go(false)},0);
}

function fuzz(){running=true;st.className='run';go(false);}
function stop(){running=false;st.className='';st.textContent='Stopped at seed '+activeSeed+'. corpus='+CORP.length;}
function runManual(){running=false;st.className='';st.textContent='Running manual...';go(true);}
function copySrc(){navigator.clipboard.writeText(src.textContent).then(function(){st.className='';st.textContent='Copied.'})}
function clr(){out.innerHTML='';st.className='';st.textContent='Cleared — seed='+seed;}
function showCrash(){try{var c=localStorage.getItem('LCRASH');if(c){var o=JSON.parse(c);src.textContent='-- LAST CRASH seed '+o.seed+'\n'+o.prog;st.className='';st.textContent='Loaded last crash.'}else{st.className='';st.textContent='No crash stored.'}}catch(e){}}

window.addEventListener('error',function(e){out.innerHTML+='<span style="color:#f66">PAGE ERROR: '+e.message+'</span>\n';out.scrollTop=out.scrollHeight;});

loadCorp();
try{
 var ps=localStorage.getItem('LRUN');
 var pa=localStorage.getItem('LASEED');
 var pp=localStorage.getItem('LSRC');
 if(pp!==null)src.textContent=pp;
 if(ps!==null&&!Q.has('seed')){seed=+ps;}
 if(pa!==null&&pa!=='MANUAL'){activeSeed=+pa;}
}catch(e){}
if(!ta.value.trim())ta.value='structuredClone([new Uint8Array(64)])';
st.textContent='Stopped at seed '+activeSeed+'. mode='+MODE+' ms='+MS+' corpus='+CORP.length;
