<!doctype html>
<meta name=viewport content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>jscfuzz v39-FIXED</title>
<style>
body{background:#000;color:#aaa;font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;margin:0;padding:8px}
#out{white-space:pre-wrap;word-break:break-all;max-height:50vh;overflow:auto}
button{background:#222;color:#ddd;border:1px solid #444;padding:8px 14px;margin:4px;cursor:pointer}
#ver{color:#f66;font-weight:700}
#src{background:#240a08;color:#f99;padding:8px;margin:8px 0;white-space:pre-wrap;max-height:30vh;overflow:auto}
#status{color:#888}
#status.run{color:#0f0}
#ifr{position:absolute;left:-10px;width:1px;height:1px;opacity:.01}
.crash{color:#f66;font-weight:bold}
.success{color:#0f0}
</style>
<div id=ver>jscfuzz v39-FIXED | MTE-BYPASS</div>
<div id=out></div>
<div>
<button onclick=fuzz()>FUZZ</button>
<button onclick=stop()>STOP</button>
<button onclick=showCrash()>SHOW LAST CRASH</button>
</div>
<div id=src>--</div>
<div id=status>Ready</div>
<iframe id=ifr sandbox="allow-scripts allow-same-origin"></iframe>
<script>
var seed=0,running=false,runOpen=false,iframeTimer=0,lastCrash='';

var PATTERNS=[
function(){return 'var ab=new ArrayBuffer(256,{maxByteLength:1024});var ta=new Uint8Array(ab);try{structuredClone(ta,{transfer:[ab]});return "ok";}catch(e){return "err:"+e.name;}'},
function(){return 'var ab=new ArrayBuffer(512,{maxByteLength:8192});Object.defineProperty(ab,"byteLength",{get:function(){return 0x7fffffff;}});var ta=new Uint8Array(ab);try{var c=structuredClone(ta,{transfer:[ab]});return "fake:"+c.byteLength;}catch(e){return "catch:"+e.name;}'},
function(){return 'var ab=new ArrayBuffer(1024,{maxByteLength:4096});var ta=new Uint8Array(ab);var w=new Worker(URL.createObjectURL(new Blob(["onmessage=function(e){try{e.data.resize(2048);}catch(x){}}"])));w.postMessage(ab);try{structuredClone(ta,{transfer:[ab]});}catch(e){}w.terminate();return "worker";'},
function(){return 'var ab=new ArrayBuffer(256);var ta=new Uint8Array(ab);var r=Proxy.revocable(ta,{});try{structuredClone(r.proxy,{transfer:[ab]});r.revoke();return "proxy-ok";}catch(e){return "proxy:"+e.name;}'},
function(){return 'var ab=new ArrayBuffer(256,{maxByteLength:Infinity});try{ab.resize(NaN);}catch(e){}try{ab.resize(-1);}catch(e){}var ta=new Uint8Array(ab);try{structuredClone(ta,{transfer:[ab]});}catch(e){}return "inf";'},
function(){return 'var wm=new WebAssembly.Memory({initial:1,maximum:4});var ab=wm.buffer;var ta=new Uint8Array(ab);setTimeout(function(){try{wm.grow(1);}catch(e){}},0);try{structuredClone(ta,{transfer:[ab]});}catch(e){}return "wasm";'},
function(){return 'var ab=new ArrayBuffer(256);var ta=new Uint8Array(ab);ta[Symbol.toPrimitive]=function(h){if(h==="number"){ab.transfer();return 0;}return ta;};try{structuredClone(ta,{transfer:[ab]});}catch(e){}return "sym";'},
function(){return 'var ab=new ArrayBuffer(256,{maxByteLength:1024});var ta=new Uint8Array(ab);var sub=ta.subarray(128,256);ab.resize(128);try{structuredClone(sub,{transfer:[ab]});}catch(e){}return "sub";'}
];

function mk(s){return function(){s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function ri(R,n){return Math.floor(R()*n)%n}

function gen(sd){
var R=mk(sd);
var s='"use strict";var r=[];';
for(var i=0;i<3;i++){
var p=PATTERNS[ri(R,PATTERNS.length)]();
s+='try{r.push((function(){'+p+'})());}catch(e){r.push("ERR:"+e.name);}';
}
s+='return r.join("|");';
return s;
}

function PRE(p){
return '<!doctype html><meta charset=utf-8><script>var C=async function(){try{return await(async function(){'+p+'})();}catch(e){return "CRASH:"+e.name;}};C().then(function(c){C().then(function(h){parent.postMessage({k:"r",cold:c,hot:h},"*")})});<\/script>';
}

function kill(){try{ifr.contentWindow.location='about:blank'}catch(e){}clearTimeout(iframeTimer);}

function run(p,ms){
return new Promise(function(res){
kill();
var done=false;
function fin(o){if(done)return;done=true;clearTimeout(iframeTimer);window.removeEventListener('message',onmsg);res(o)}
function onmsg(e){if(e.data&&e.data.k==='r')fin(e.data)}
window.addEventListener('message',onmsg);
iframeTimer=setTimeout(function(){fin({cold:'HANG',hot:'HANG'})},ms);
ifr.srcdoc=PRE(p);
});
}

async function go(){
if(runOpen)return;
runOpen=true;
var p=gen(seed);
document.getElementById('src').textContent='-- seed '+seed+'\n'+p;
document.getElementById('status').className='run';
document.getElementById('status').textContent='Running seed '+seed+'...';
var o=await run(p,5000);
runOpen=false;
var stx;
if(o.cold==='HANG'){stx='<span class="crash">HANG/CRASH</span>';lastCrash=p;}
else if(o.cold!==o.hot){stx='<span class="crash">DIVERGE! '+o.cold+' vs '+o.hot+'</span>';lastCrash=p;}
else if(o.cold.indexOf('CRASH:')===0){stx='<span class="crash">'+o.cold+'</span>';lastCrash=p;}
else{stx='<span class="success">'+o.cold+'</span>';}
var line='<div>-- seed '+seed+'</div><div>'+stx+'</div>';
document.getElementById('out').innerHTML+=line;
document.getElementById('out').scrollTop=99999;
if(!running){document.getElementById('status').textContent='Stopped at seed '+seed;return;}
seed++;
document.getElementById('status').textContent='Running seed '+seed+'...';
if(running)setTimeout(go,100);
}

function fuzz(){running=true;go();}
function stop(){running=false;document.getElementById('status').textContent='Stopped at seed '+seed;}
function showCrash(){if(lastCrash)document.getElementById('src').textContent=lastCrash;}

document.getElementById('status').textContent='Ready. Press FUZZ.';
</script>
