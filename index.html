<!doctype html>
<html><head><meta charset=utf-8><title>jscfuzz v18</title>
<style>
body{background:#111;color:#ddd;font:12px/1.4 ui-monospace,Menlo,monospace;margin:0;padding:8px}
#log{white-space:pre-wrap;word-break:break-all}
#box{white-space:pre-wrap;word-break:break-all;background:#08240a;color:#9f9;padding:6px;margin-top:8px;font-size:11px}
#ifr{position:absolute;left:-10px;width:1px;height:1px;border:0;opacity:.01}
</style></head><body>
<div id=log></div><div id=box></div>
<iframe id=ifr sandbox="allow-scripts allow-same-origin"></iframe>
<script>
var VER='v18';
var Q=new URLSearchParams(location.search);
var MODE=+(Q.get('mode')||0);
var MS=+(Q.get('ms')||2000);
var NL=+(Q.get('n')||10);
var SHOW=Q.has('show')||Q.has('noexec');
var BIG=Q.has('big'),SMALL=Q.has('small');
var START=Q.has('seed')?+Q.get('seed'):0;
var ifr=document.getElementById('ifr'),log=document.getElementById('log'),box=document.getElementById('box');
var seed=START,runOpen=false,timer=0;

function mk(s){return function(){s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function ri(R,n){var x=Math.floor(R()*n)%n;return x<0?0:x}
function sz(){return SMALL?1024:BIG?(1<<24):(1<<14)}
function hb(s){try{localStorage.setItem('jscfuzz-hb',s)}catch(e){}}

var PAT=[
function(){return 'var a=new Uint8Array(SZ);a[0]=1;return structuredClone(a)'},
function(){return 'var b=new ArrayBuffer(SZ);var v=new DataView(b);v.setUint8(0,1);return structuredClone(v)'},
function(){return 'var b=new ArrayBuffer(SZ);var v=new Uint8Array(b);return structuredClone([v,v])'},
function(){return 'var v=new Float64Array(SZ>>3);return structuredClone(v)'},
function(){return 'var v=new Uint8Array(SZ);return structuredClone(v,{transfer:[v.buffer]})'},
function(){return 'var v=new Uint8Array(SZ);return structuredClone(v,{transfer:[v.buffer,v.buffer]})'},
function(){return 'var v=new Uint8Array(SZ);var t=v.buffer;structuredClone(v,{transfer:[t]});return structuredClone(t)'},
function(){return 'var v=new Uint8Array(SZ);var m=new Map();m.set("k",v);return structuredClone(m)'},
function(){return 'var v=new Uint8Array(SZ);return structuredClone(new Set([v]))'},
function(){return 'var v=new Uint8Array(SZ);return structuredClone([...v])'},
function(){return 'var v=new Uint8Array(SZ);return structuredClone(v.subarray(1))'},
function(){return 'var v=new BigInt64Array(SZ>>3);return structuredClone(v)'},
function(){return 'var v=new Uint8Array(SZ);return structuredClone({a:{b:{c:v}}})'},
function(){return 'var v=new Uint8Array(SZ);return structuredClone(new Proxy({a:v},{}))'},
function(){return 'var v=new Uint8Array(SZ);var r=Proxy.revocable({},{});r.revoke();return structuredClone(r.proxy)'},
function(){return 'var c=document.createElement("canvas");c.width=64;c.height=64;var x=c.getContext("2d");x.fillRect(0,0,8,8);return structuredClone(x.getImageData(0,0,64,64))'},
function(){return 'var v=new Uint8Array(new Set([3,4,5]));return structuredClone(v)'},
function(){return 'var v=new Uint8Array(SZ);var bc=new BroadcastChannel("c");bc.postMessage(v);return v'},
function(){return 'var v=new Uint8Array(SZ);return structuredClone({[Symbol()]:v})'},
function(){return 'var v=new Uint8Array(SZ);return structuredClone(new Date())&&structuredClone(v)'}
];

function rs(sd){
  var R=mk(sd),s='var SZ='+sz()+';';
  for(var i=0;i<NL;i++){
    var p=(MODE===1?PAT[i%PAT.length]:PAT[ri(R,PAT.length)])();
    s+='W(function(){return (function(){'+p+'})()},0);';
  }
  return s;
}

function rs5(){
  var s='var AC=null;try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}';
  s+='var K=["png","gif","jpg","webp","ttf","woff","wav","mp3","svg","wasm"],i,t,b;';
  s+='for(i=0;i<60;i++){t=K[ri(R,K.length)];b=by(t,R);';
  s+='if(t==="png"||t==="gif"||t==="jpg"||t==="webp")await T(createImageBitmap(new Blob([b])),1500);';
  s+='if(t==="ttf"||t==="woff")await T(new FontFace("f"+i,b).load(),1500);';
  s+='if((t==="wav"||t==="mp3")&&AC)await T(AC.decodeAudioData(b.buffer.slice(0)),1500);';
  s+='if(t==="svg")await T(P(new TextDecoder().decode(b)),1500);';
  s+='if(t==="wasm")await T(WebAssembly.compile(b),1500);}';
  return s;
}

var BY='function by(t,R){var n=8+Math.floor(R()*200),a=new Uint8Array(n+16),i;'+
'for(i=0;i<a.length;i++)a[i]=Math.floor(R()*256);'+
'if(t==="svg"){var q="<svg xmlns=\\"http://www.w3.org/2000/svg\\" width=\\""+(1+Math.floor(R()*50))+"\\">";'+
'var g=["path","rect","circle","g","text","use","filter","image"];'+
'for(i=0;i<6;i++)q+="<"+g[Math.floor(R()*g.length)]+" d=\\"M"+Math.floor(R()*99)+" "+Math.floor(R()*99)+"\\" xlink:href=\\"#z\\"/>";'+
'return new TextEncoder().encode(q+"</svg>")}'+
'var m={png:[137,80,78,71,13,10,26,10],gif:[71,73,70,56,57,97],jpg:[255,216,255,224],'+
'webp:[82,73,70,70],ttf:[0,1,0,0],woff:[119,79,70,70],wav:[82,73,70,70],mp3:[73,68,51,3],'+
'wasm:[0,97,115,109,1,0,0,0]}[t];'+
'if(m)for(i=0;i<m.length;i++)a[i]=m[i];return a}';

function PRE(prog,sd){
 return '<!doctype html><meta charset=utf-8><script>'+
 'var SEED='+sd+';var R=mk(SEED);var TR=[];'+
 'function mk(s){return function(){s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}'+
 'function W(f,fb){try{var r=f();TR.push("ok:"+(r===undefined?"u":typeof r));return r}catch(e){TR.push("x:"+(e&&e.name||"E"));return fb}}'+
 'function T(p,ms){return Promise.race([p.then(function(){},function(){}),new Promise(function(r){setTimeout(r,ms)})])}'+
 'function P(x){try{(new DOMParser()).parseFromString(x,"image/svg+xml")}catch(e){}return Promise.resolve(1)}'+
 BY+
 'var COLD=async function(){TR=[];R=mk(SEED);try{await (async function(){'+prog+'})()}catch(e){TR.push("top:"+(e&&e.name))}return TR.join(";")};'+
 '(async function(){var c=await COLD();var h=await COLD();parent.postMessage({k:"r",cold:c,hot:h},"*")})()'+
 '<\/script>';
}

function runInIframe(prog,sd,ms){
 return new Promise(function(res){
  var done=false;
  function fin(o){if(done)return;done=true;clearTimeout(timer);window.removeEventListener('message',onmsg);res(o)}
  function onmsg(e){if(!e.data||e.data.k!=='r')return;fin(e.data)}
  window.addEventListener('message',onmsg);
  timer=setTimeout(function(){fin({k:'r',cold:'HANG',hot:'HANG'})},ms);
  ifr.srcdoc=PRE(prog,sd);
 });
}

async function step(){
 if(runOpen)return;
 runOpen=true;
 var prog=MODE===5?rs5():rs(seed);
 box.textContent=prog;
 try{localStorage.setItem('jscfuzz-prog',prog);localStorage.setItem('jscfuzz-seed',String(seed))}catch(e){}
 hb('last: seed:'+seed+':running');
 var o=await runInIframe(prog,seed,MS);
 runOpen=false;
 var st;
 if(o.cold==='HANG')st='HANG/CRASH killed at '+MS+'ms';
 else if(o.cold===o.hot)st='same: '+o.cold;
 else{st='DIVERGE cold='+o.cold+' hot='+o.hot;try{localStorage.setItem('jscfuzz-div',prog)}catch(e){}}
 log.textContent=VER+' mode='+MODE+' ms='+MS+' n='+NL+'\n'+st+'\n'+log.textContent;
 if(SHOW)return;
 seed++;step();
}

try{
 var ps=localStorage.getItem('jscfuzz-seed');
 if(ps!==null&&!Q.has('seed')){log.textContent='PREVIOUS RUN STOPPED ON SEED '+ps+'\n';box.textContent=localStorage.getItem('jscfuzz-prog')||''}
}catch(e){}
step();
</script>
</body></html>
