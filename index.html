<!doctype html>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>jscfuzz</title>
<style>
body{font:12px ui-monospace,monospace;background:#0d0d0d;color:#ddd;margin:8px}
pre{white-space:pre-wrap;background:#000;padding:8px;border:1px solid #333;max-height:35vh;overflow:auto}
button{padding:8px 12px;margin:2px}
textarea{width:100%;height:120px;background:#000;color:#0f0;font:11px monospace;border:1px solid #333}
</style>
<h3>jsc-fuzz</h3>
<div><button id=go>FUZZ</button><button id=stop>STOP</button><button id=run>RUN</button><button id=copy>COPY</button></div>
<pre id=out></pre>
<textarea id=src readonly></textarea>
<textarea id=in placeholder="paste a snippet here, then tap RUN"></textarea>
<script>
const OUT=document.getElementById('out'), SRC=document.getElementById('src'), IN=document.getElementById('in'), HB='jscfuzz-hb';
const Q=new URLSearchParams(location.search);
const VER='v4';
const HANGMS=+Q.get('ms')||8000;
const HOTMS =+Q.get('hotms')||2000;
const SMALL =Q.get('small')!==null;
const log=(...a)=>{OUT.textContent+=a.map(x=>typeof x==='string'?x:JSON.stringify(x)).join(' ')+'\n';OUT.scrollTop=1e9};
const hb=v=>localStorage.setItem(HB,v);
IN.value=localStorage.getItem('jscfuzz-code')||'';
IN.oninput=()=>localStorage.setItem('jscfuzz-code',IN.value);
log('jscfuzz '+VER+(SMALL?' small':'')+'  ms='+HANGMS+' hotms='+HOTMS);
const prev=localStorage.getItem(HB)||'';
log('last: '+prev);
if(prev.includes(':running')) log('>>> PREVIOUS RUN DIED ON '+prev.split(':')[1]);
if(prev.includes(':hang'))    log('>>> '+prev.split(':')[1]+' HUNG LAST TIME');

const mul=s=>{let a=s>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}};
const P=(r,A)=>A[(r()*A.length)|0];
const NUMS=SMALL
  ?['0','1','-1','2','2**8','2**12','2**16','-0','0.5','NaN','Infinity']
  :['0','1','-1','2**31-1','2**31','2**32','2**32-1','2**32+1','2**53-1','2**53','2**53+1','0.5','-0','NaN','Infinity','1e308'];
const BIGS=['0n','1n','-1n','2n**31n','2n**63n','2n**64n','2n**64n+1n','-(2n**63n)-1n','9007199254740993n'];
const STRS=['""','"a"','"\\u0000"','"\\u{1f600}"','"ab".repeat(64)','"x".repeat(1024)'];

function gen(seed){
  const r=mul(seed), V=[], L=[];
  const num=()=>V.length&&r()<0.65?P(r,V):P(r,NUMS);
  const big=()=>V.length&&r()<0.65?P(r,V):P(r,BIGS);
  const str=()=>V.length&&r()<0.65?P(r,V):P(r,STRS);
  const add=e=>{const n='v'+V.length;V.push(n);L.push('let '+n+'='+e+';');return n};
  const K=[
    ()=>`new Uint8Array(${num()})`,
    ()=>`new Int32Array(${num()})`,
    ()=>`new BigInt64Array([${big()},${big()}])`,
    ()=>`[${num()},${num()},${num()}]`,
    ()=>`({a:${num()},b:${str()}})`,
    ()=>`new Map([[${num()},${str()}]])`,
    ()=>`new Set([${num()},${num()}])`,
    ()=>`(${num()}).toString(${num()})`,
    ()=>`String(${str()}).repeat(${num()})`,
    ()=>`new ArrayBuffer(${num()})`,
    ()=>`String(${str()}).split("")`,
    ()=>`JSON.parse(JSON.stringify(${num()}))`,
    ()=>`structuredClone([${num()},${str()}])`,
    ()=>`Object.assign({},[${num()}])`,
    ()=>`new Proxy({},{get(t,k){return ${num()}}})`,
    ()=>`Promise.resolve(${num()})`,
    ()=>`(${num()})>>>0`,
    ()=>`Math.imul(${num()},${num()})`,
    ()=>`(${big()})+(1n)`,
  ];
  const n=3+((r()*8)|0);
  for(let i=0;i<n;i++) add(P(r,K)());
  for(let i=0;i<2;i++){
    const A=P(r,V), B=P(r,V);
    const O=[
      ()=>`${A}.slice(${num()},${num()})`,
      ()=>`${A}.sort((a,b)=>${num()})`,
      ()=>`${A}.indexOf(${num()})`,
      ()=>`${A}.subarray(0,${num()})`,
      ()=>`${A}.set ? (${A}.set(${B},0), ${A}) : ${A}`,
      ()=>`Array.from(${A})`,
    ];
    add(P(r,O)());
  }
  return {body:L.join('\n'), ret:P(r,V)};
}

const WORKER = `
function canon(v){
  try{
    const t=typeof v;
    if(t==='number') return Object.is(v,-0)?'num:-0':('num:'+v);
    if(t==='bigint') return 'big:'+v;
    if(t==='string') return 'str:'+v.length+':'+v.slice(0,16);
    if(t==='boolean'||t==='undefined') return t+':'+v;
    if(v===null) return 'null';
    let extra='';
    if(v.byteLength!==undefined) extra='bl:'+v.byteLength;
    else if(v.length!==undefined) extra='ln:'+v.length;
    return 'obj:'+(v.constructor&&v.constructor.name)+':'+extra;
  }catch(e){ return 'canonerr:'+e.name }
}
onmessage=e=>{
  const {id,body,ret,hotms}=e.data;
  let f;
  try{ f=new Function('"use strict";'+body+(ret?';return canon('+ret+');':'')) }
  catch(err){ postMessage({id,parse:err.name+': '+err.message}); return }
  let cold,hot,iters=0,cut=false;
  try{ cold=f() }catch(err){ cold='threw:'+err.name }
  const t0=Date.now();
  try{
    for(let i=0;i<20000;i++){
      hot=f(); iters=i+1;
      if(((i+1)&127)===0 && Date.now()-t0>hotms){ cut=true; break }
    }
  }catch(err){ hot='threw:'+err.name }
  postMessage({id,cold,hot,iters,cut,div: cold!==hot});
}`;

let worker=null, seed=0, running=false, replaying=false, divs=[], hangs=[], slow=[], stats={n:0,div:0,threw:0,hang:0};
function mkworker(){
  worker=new Worker(URL.createObjectURL(new Blob([WORKER],{type:'text/javascript'})));
  worker.onmessage=onmsg;
  worker.onerror=e=>log('worker err '+e.message);
}
function killworker(){ if(worker){worker.terminate();worker=null} }

let wd=null, pending=null;
function arm(s,cont){
  pending=s;
  wd=setTimeout(()=>{
    if(pending!==s) return;
    pending=null;
    log('*** HANG '+s+' - cold never returned, worker killed');
    stats.hang++; hangs.push(s);
    killworker(); hb('x:'+s+':hang');
    if(cont) setTimeout(step,50);
  },HANGMS);
}
function step(){
  if(!running) return;
  seed=(seed+1)>>>0;
  const g=gen(seed);
  SRC.value=g.body+'\nreturn '+g.ret+';';
  hb('seed:'+seed+':running');
  if(!worker) mkworker();
  worker.postMessage({id:seed, body:g.body, ret:g.ret, hotms:HOTMS});
  arm(seed,true);
}
function onmsg(e){
  clearTimeout(wd); pending=null;
  const {id,cold,hot,div,parse,iters,cut}=e.data;
  stats.n++;
  if(parse){ stats.threw++; log(id+' PARSE '+parse); }
  else if(div){ stats.div++; divs.push(id); log('*** DIVERGENCE '+id+'\n  cold='+cold+'\n  hot ='+hot); }
  else if(replaying){ log(id+' OK  cold='+cold+'  hot='+hot+(cut?'  [hot cut @'+iters+']':'')); }
  if(cut&&!div&&!parse) slow.push(id);
  hb('x:'+id+':done');
  if(stats.n%25===0) log('-- '+stats.n+' run, '+stats.div+' div, '+hangs.length+' hang');
  setTimeout(step,10);
}

const replay=Q.get('seed');
if(replay!==null){
  replaying=true;
  const s=+replay, g=gen(s);
  SRC.value=g.body+'\nreturn '+g.ret+';';
  log('replaying seed '+s);
  mkworker();
  hb('seed:'+s+':running');
  worker.postMessage({id:s,body:g.body,ret:g.ret,hotms:HOTMS});
  arm(s,false);
} else if((prev.includes(':running')||prev.includes(':hang'))&&!prev.startsWith('x:')){
  seed=+prev.split(':')[1]||0;
  log('auto-resuming after seed '+seed);
  running=true; setTimeout(step,400);
}

document.getElementById('go').onclick=()=>{ if(running)return; replaying=false; running=true; log('fuzzing'); step() };
document.getElementById('stop').onclick=()=>{ running=false; killworker(); clearTimeout(wd); pending=null; log('stopped. div='+JSON.stringify(divs)+' hang='+JSON.stringify(hangs)) };
document.getElementById('run').onclick=()=>{
  const code=IN.value; if(!code.trim()) return;
  running=false; replaying=true; SRC.value=code;
  log('RUN user code');
  if(!worker) mkworker();
  hb('x:user:running');
  worker.postMessage({id:'user',body:code,ret:'',hotms:HOTMS});
  arm('user',false);
};
document.getElementById('copy').onclick=()=>navigator.clipboard.writeText(OUT.textContent);
log('tap FUZZ, or paste a snippet and tap RUN');
</script>
