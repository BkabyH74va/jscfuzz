<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OOM-PROBE</title>
<body style="background:#000;color:#0f0;font:14px monospace;white-space:pre-wrap;margin:10px">
<div id=o>[OOM-PROBE] allocation-failure window</div>
<script>
const o=document.getElementById('o');
const log=m=>o.textContent+="\n"+m;
window.addEventListener('error',e=>log("[ERROR] "+e.message));
log("[*] start");
(async()=>{
// sizes where allocation CANNOT succeed (> device RAM)
const TESTS=[
  ["f64-8G-elems",Float64Array,0x100000000/8],   // 8GB request
  ["u8-8G",Uint8Array,0x200000000],                 // 8GB
  ["f64-34G",Float64Array,0xFFFFFFFF],              // 34GB in elements
  ["u8-max64",Uint8Array,0xFFFFFFFFFFFFFFFF]        // insane
];
for(const [tag,C,n] of TESTS){
  try{
    const ab=new ArrayBuffer(64,{maxByteLength:0x100000});
    const out=ab.transferToFixedLength(n);
    log(tag+": RETURNED bl="+out.byteLength+" (should have thrown)");
    const v=new Uint8Array(out);
    v[0]=0x41;
    const tail=v[out.byteLength-1];
    log(tag+": tail read=0x"+(tail!==undefined?tail.toString(16):"undef")+" *** ALIVE = POSSIBLE CONFUSION ***");
  }catch(e){ log(tag+": "+e.name+" (correct-ish)"); }
  await new Promise(r=>setTimeout(r,100));
}
log("DONE");
})();
</script>
